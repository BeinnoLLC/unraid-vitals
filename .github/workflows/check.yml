name: check

# unraid-vitals — plan 106 P13-07; extended for #117 (P20-12).
# Nothing ran on push before this: a syntax error (PHP, JS/mjs, or shell)
# could sit on main until the next manual `npm run check`. This runs the
# same check on every push and pull request that a developer would run
# locally, so CI and local dev never disagree about what "clean" means.
#
# `npm run check` is lint AND tests. It was lint-only for a long time, which is
# how a behavioural regression (floor findings switching themselves off when a
# prompt row got trimmed) sat on main: every suite in the tree passed, and
# nothing ran them. Lint proves a file parses, not that it does what it claims.
#
# Node 24, not 20: the agent stores findings in SQLite via the `node:sqlite`
# builtin (lib/db.mjs), which does not exist before Node 22.5 and needed an
# experimental flag until 23.4. This job pinned 20, so the moment tests were
# added to `check` it went red on a suite that had no way to pass there — the
# local/CI divergence this workflow exists to prevent, in the other direction.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install PHP CLI
        # php-sqlite3 is not optional. The engine persists findings and events
        # through SQLite3 (include/db.php, include/checks.php); without the
        # extension the DB helpers return null and every suite that touches
        # persistence fails for a reason that has nothing to do with the code
        # under test. The runner checks for it up front and says so instead.
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3

      - run: npm run check
